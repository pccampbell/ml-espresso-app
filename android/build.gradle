allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Force all subprojects (plugins) to use Java version from gradle.properties
// This eliminates Java 8 obsolete warnings from old plugins
subprojects {
    afterEvaluate {
        if (it.hasProperty('android')) {
            def javaVersion = JavaVersion.toVersion(rootProject.findProperty('javaVersion') ?: '17')
            it.android {
                compileOptions {
                    sourceCompatibility = javaVersion
                    targetCompatibility = javaVersion
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
